services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vileoruf_crm}
      POSTGRES_USER: ${POSTGRES_USER:-vileoruf_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vileoruf_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - vileoruf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  vileoruf_postgres_data:
